<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Game Counters</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242836;
      --border: #2e3345;
      --text: #e8eaf0;
      --text2: #9ba3b5;
      --primary: #6c5ce7;
      --primary-light: #a29bfe;
      --green: #00b894;
      --red: #e17055;
      --orange: #fdcb6e;
      --blue: #74b9ff;
      --radius: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }
    .header a {
      color: var(--text2);
      text-decoration: none;
      font-size: 20px;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .page { display: none; padding: 16px; padding-bottom: 100px; }
    .page.active { display: block; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      color: #fff;
      min-height: 44px;
    }
    .btn:active { opacity: 0.7; }
    .btn-primary { background: var(--primary); }
    .btn-green { background: var(--green); }
    .btn-red { background: var(--red); }
    .btn-ghost {
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--border);
    }
    .btn-full { width: 100%; }
    .btn-sm { padding: 8px 14px; font-size: 13px; min-height: 36px; }

    /* Cards */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .card:active { background: var(--surface2); }
    .card-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
    .card-sub { color: var(--text2); font-size: 13px; }

    /* Game type selector */
    .game-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .game-type-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .game-type-card.selected {
      border-color: var(--primary);
      background: var(--surface2);
    }
    .game-type-card:active { background: var(--surface2); }
    .game-type-icon { font-size: 32px; margin-bottom: 8px; }
    .game-type-name { font-weight: 600; font-size: 14px; }
    .game-type-desc { color: var(--text2); font-size: 11px; margin-top: 4px; }

    /* Form inputs */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
    .form-input {
      width: 100%;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 15px;
      min-height: 44px;
    }
    .form-input:focus { outline: none; border-color: var(--primary); }

    /* Player list */
    .player-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .player-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 14px;
    }
    .player-chip .remove {
      cursor: pointer;
      color: var(--text2);
      font-size: 16px;
      line-height: 1;
    }
    .player-add-row {
      display: flex;
      gap: 8px;
    }
    .player-add-row .form-input { flex: 1; }

    /* Scoreboard */
    .scoreboard {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }
    .score-player {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 16px;
      transition: border-color 0.15s;
    }
    .score-player.active-turn {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }
    .score-player.winner {
      border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green);
    }
    .score-player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .score-player-name { font-weight: 600; font-size: 16px; }
    .score-player-total {
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .score-player-detail { color: var(--text2); font-size: 12px; margin-top: 4px; }

    /* Number pad */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 320px;
      margin: 0 auto 16px;
    }
    .numpad-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 20px;
      font-weight: 600;
      padding: 16px;
      cursor: pointer;
      min-height: 56px;
      transition: background 0.1s;
    }
    .numpad-btn:active { background: var(--surface2); }
    .numpad-btn.action { background: var(--primary); border-color: var(--primary); }
    .numpad-btn.action:active { opacity: 0.8; }
    .numpad-btn.delete { color: var(--red); }

    /* Score input display */
    .score-input-display {
      text-align: center;
      font-size: 36px;
      font-weight: 700;
      padding: 16px;
      margin-bottom: 12px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .score-input-label {
      text-align: center;
      color: var(--text2);
      font-size: 14px;
      margin-bottom: 8px;
    }

    /* Quick score buttons */
    .quick-scores {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .quick-score-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      padding: 8px 16px;
      cursor: pointer;
      min-height: 40px;
    }
    .quick-score-btn:active { background: var(--primary); }
    .quick-score-btn.negative { color: var(--red); }

    /* Score history */
    .score-history {
      margin-top: 20px;
    }
    .score-history h3 {
      font-size: 14px;
      color: var(--text2);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .score-history-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .score-history-entry .player { color: var(--text2); }
    .score-history-entry .value { font-weight: 600; font-variant-numeric: tabular-nums; }
    .score-history-entry .undo {
      color: var(--red);
      cursor: pointer;
      font-size: 12px;
      padding: 4px 8px;
      border: 1px solid var(--red);
      border-radius: 6px;
      background: transparent;
    }

    /* Darts specific */
    .darts-checkout-hint {
      text-align: center;
      padding: 8px;
      background: var(--surface2);
      border-radius: 8px;
      color: var(--orange);
      font-size: 13px;
      margin-bottom: 12px;
    }

    /* 500 specific */
    .team-score-input {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .team-input-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 12px;
      text-align: center;
    }
    .team-input-card h4 { font-size: 14px; margin-bottom: 8px; }
    .team-input-card .form-input { text-align: center; font-size: 18px; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text2);
    }
    .empty-state-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state-text { font-size: 15px; margin-bottom: 20px; }

    /* Section header */
    .section-header {
      font-size: 12px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      margin-top: 20px;
    }
    .section-header:first-child { margin-top: 0; }

    /* Status badge */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-active { background: rgba(0,184,148,0.2); color: var(--green); }
    .badge-completed { background: rgba(155,163,181,0.2); color: var(--text2); }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .toolbar .btn { flex: 1; }

    /* Score table for mini golf / scrabble */
    .score-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .score-table th, .score-table td {
      padding: 8px 6px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .score-table th {
      color: var(--text2);
      font-size: 12px;
      font-weight: 500;
      position: sticky;
      top: 60px;
      background: var(--bg);
    }
    .score-table td { font-variant-numeric: tabular-nums; }
    .score-table .total-row { font-weight: 700; border-top: 2px solid var(--border); }

    /* Game actions bar */
    .game-actions {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      z-index: 100;
    }
    .game-actions .btn { flex: 1; }

    /* Confirmation dialog */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 340px;
      width: 100%;
    }
    .modal h3 { margin-bottom: 12px; }
    .modal p { color: var(--text2); font-size: 14px; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions .btn { flex: 1; }

    /* Darts settings */
    .setting-options {
      display: flex;
      gap: 8px;
    }
    .setting-option {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
    }
    .setting-option.selected {
      border-color: var(--primary);
      background: var(--surface2);
    }

    .winner-banner {
      text-align: center;
      padding: 16px;
      background: linear-gradient(135deg, rgba(0,184,148,0.2), rgba(108,92,231,0.2));
      border-radius: var(--radius);
      margin-bottom: 16px;
      border: 1px solid var(--green);
    }
    .winner-banner .trophy { font-size: 36px; }
    .winner-banner .winner-text { font-size: 18px; font-weight: 700; margin-top: 8px; }
  </style>
</head>
<body>

<div class="header">
  <a href="/" id="back-btn">←</a>
  <h1 id="header-title">Game Counters</h1>
</div>

<!-- Home Page: list of games -->
<div id="page-home" class="page active">
  <div style="margin-bottom: 16px;">
    <button class="btn btn-primary btn-full" onclick="showPage('new-game')">+ New Game</button>
  </div>

  <div class="section-header">Active Games</div>
  <div id="active-games"></div>

  <div class="section-header">Completed Games</div>
  <div id="completed-games"></div>
</div>

<!-- New Game Page -->
<div id="page-new-game" class="page">
  <div class="section-header">Choose a Game</div>
  <div class="game-grid" id="game-type-grid"></div>

  <div id="game-settings"></div>

  <div class="form-group">
    <label class="form-label">Players</label>
    <div class="player-chips" id="player-chips"></div>
    <div class="player-add-row">
      <input type="text" class="form-input" id="player-name-input" placeholder="Player name" maxlength="30">
      <button class="btn btn-ghost btn-sm" onclick="addPlayer()">Add</button>
    </div>
  </div>

  <button class="btn btn-green btn-full" id="start-game-btn" onclick="createGame()" disabled>Start Game</button>
</div>

<!-- Game Play Page -->
<div id="page-game" class="page"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-text"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" id="modal-confirm" onclick="closeModal()">Confirm</button>
    </div>
  </div>
</div>

<script>
const API = '/game-counters/api';

// Game type definitions
const GAME_TYPES = {
  darts: {
    icon: '🎯',
    name: 'Darts',
    desc: '501/301 countdown',
    minPlayers: 1,
    maxPlayers: 8,
    defaultPlayers: ['Player 1', 'Player 2'],
  },
  '500': {
    icon: '🃏',
    name: '500',
    desc: 'Card game to 500',
    minPlayers: 2,
    maxPlayers: 6,
    defaultPlayers: ['Team 1', 'Team 2'],
  },
  scrabble: {
    icon: '📝',
    name: 'Scrabble',
    desc: 'Word score tracker',
    minPlayers: 2,
    maxPlayers: 4,
    defaultPlayers: ['Player 1', 'Player 2'],
  },
  'mini-golf': {
    icon: '⛳',
    name: 'Mini Golf',
    desc: 'Stroke counter per hole',
    minPlayers: 1,
    maxPlayers: 8,
    defaultPlayers: ['Player 1', 'Player 2'],
  },
  generic: {
    icon: '🔢',
    name: 'General',
    desc: 'Simple score tracker',
    minPlayers: 1,
    maxPlayers: 12,
    defaultPlayers: ['Player 1', 'Player 2'],
  },
  rummy: {
    icon: '🂡',
    name: 'Rummy',
    desc: 'Card game scorer',
    minPlayers: 2,
    maxPlayers: 6,
    defaultPlayers: ['Player 1', 'Player 2'],
  },
};

// State
let state = {
  selectedGameType: null,
  players: [],
  currentSession: null,
  currentPlayers: [],
  currentScores: [],
  currentTurn: 0,
  scoreInput: '',
  settings: {},
};

// Page navigation
function showPage(page, updateHistory = true) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');

  const backBtn = document.getElementById('back-btn');
  const title = document.getElementById('header-title');

  if (page === 'home') {
    backBtn.href = '/';
    title.textContent = 'Game Counters';
    loadSessions();
  } else if (page === 'new-game') {
    backBtn.href = '#';
    backBtn.onclick = (e) => { e.preventDefault(); showPage('home'); };
    title.textContent = 'New Game';
  } else if (page === 'game') {
    backBtn.href = '#';
    backBtn.onclick = (e) => { e.preventDefault(); showPage('home'); };
    if (state.currentSession) {
      const gt = GAME_TYPES[state.currentSession.game_type];
      title.textContent = gt ? gt.name : 'Game';
    }
  }
}

// Load sessions
async function loadSessions() {
  try {
    const [activeRes, completedRes] = await Promise.all([
      fetch(`${API}/sessions?status=active`),
      fetch(`${API}/sessions?status=completed`),
    ]);
    const active = await activeRes.json();
    const completed = await completedRes.json();

    renderSessionList('active-games', active.sessions, true);
    renderSessionList('completed-games', completed.sessions, false);
  } catch (err) {
    console.error('Failed to load sessions:', err);
  }
}

function renderSessionList(containerId, sessions, isActive) {
  const container = document.getElementById(containerId);
  if (!sessions || sessions.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="padding: 20px;">
        <div class="empty-state-text">${isActive ? 'No active games. Start one!' : 'No completed games yet.'}</div>
      </div>`;
    return;
  }

  container.innerHTML = sessions.map(s => {
    const gt = GAME_TYPES[s.game_type] || { icon: '🎮', name: s.game_type };
    const date = new Date(s.created_at + 'Z').toLocaleDateString();
    return `
      <div class="card" onclick="loadGame('${s.id}')">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="font-size:24px;">${gt.icon}</div>
          <div style="flex:1;">
            <div class="card-title">${s.name || gt.name}</div>
            <div class="card-sub">${s.player_count} players · ${date}</div>
          </div>
          <span class="badge ${isActive ? 'badge-active' : 'badge-completed'}">${s.status}</span>
        </div>
      </div>`;
  }).join('');
}

// Game type selection
function initGameGrid() {
  const grid = document.getElementById('game-type-grid');
  grid.innerHTML = Object.entries(GAME_TYPES).map(([key, gt]) => `
    <div class="game-type-card" data-type="${key}" onclick="selectGameType('${key}')">
      <div class="game-type-icon">${gt.icon}</div>
      <div class="game-type-name">${gt.name}</div>
      <div class="game-type-desc">${gt.desc}</div>
    </div>
  `).join('');
}

function selectGameType(type) {
  state.selectedGameType = type;
  state.settings = {};

  document.querySelectorAll('.game-type-card').forEach(c => c.classList.remove('selected'));
  document.querySelector(`[data-type="${type}"]`).classList.add('selected');

  // Set default players
  const gt = GAME_TYPES[type];
  state.players = [...gt.defaultPlayers];
  renderPlayerChips();
  renderGameSettings();
  updateStartButton();
}

function renderGameSettings() {
  const container = document.getElementById('game-settings');
  const type = state.selectedGameType;

  if (type === 'darts') {
    state.settings.startScore = 501;
    container.innerHTML = `
      <div class="form-group">
        <label class="form-label">Starting Score</label>
        <div class="setting-options">
          <div class="setting-option selected" onclick="setDartsSetting(301, this)">301</div>
          <div class="setting-option selected" onclick="setDartsSetting(501, this)">501</div>
          <div class="setting-option" onclick="setDartsSetting(701, this)">701</div>
        </div>
      </div>`;
    // Select 501 by default
    container.querySelectorAll('.setting-option').forEach(o => o.classList.remove('selected'));
    container.querySelectorAll('.setting-option')[1].classList.add('selected');
  } else if (type === 'mini-golf') {
    state.settings.holes = 18;
    container.innerHTML = `
      <div class="form-group">
        <label class="form-label">Number of Holes</label>
        <div class="setting-options">
          <div class="setting-option" onclick="setGolfHoles(9, this)">9</div>
          <div class="setting-option selected" onclick="setGolfHoles(18, this)">18</div>
        </div>
      </div>`;
  } else {
    container.innerHTML = '';
  }
}

function setDartsSetting(score, el) {
  state.settings.startScore = score;
  el.parentElement.querySelectorAll('.setting-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}

function setGolfHoles(holes, el) {
  state.settings.holes = holes;
  el.parentElement.querySelectorAll('.setting-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}

// Player management
function renderPlayerChips() {
  const container = document.getElementById('player-chips');
  container.innerHTML = state.players.map((p, i) => `
    <div class="player-chip">
      <span>${p}</span>
      <span class="remove" onclick="removePlayer(${i})">×</span>
    </div>
  `).join('');
}

function addPlayer() {
  const input = document.getElementById('player-name-input');
  const name = input.value.trim();
  if (!name) return;

  const gt = GAME_TYPES[state.selectedGameType];
  if (gt && state.players.length >= gt.maxPlayers) return;

  state.players.push(name);
  input.value = '';
  renderPlayerChips();
  updateStartButton();
}

function removePlayer(index) {
  state.players.splice(index, 1);
  renderPlayerChips();
  updateStartButton();
}

function updateStartButton() {
  const btn = document.getElementById('start-game-btn');
  const gt = GAME_TYPES[state.selectedGameType];
  btn.disabled = !state.selectedGameType || !gt || state.players.length < gt.minPlayers;
}

// Handle enter key on player name input
document.getElementById('player-name-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addPlayer();
});

// Create game
async function createGame() {
  if (!state.selectedGameType || state.players.length < 1) return;

  try {
    const res = await fetch(`${API}/sessions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        gameType: state.selectedGameType,
        name: GAME_TYPES[state.selectedGameType].name,
        players: state.players,
        settings: state.settings,
      }),
    });
    const data = await res.json();
    await loadGame(data.sessionId);
  } catch (err) {
    console.error('Failed to create game:', err);
  }
}

// Load and render a game
async function loadGame(sessionId) {
  try {
    const res = await fetch(`${API}/sessions/${sessionId}`);
    const data = await res.json();

    state.currentSession = data.session;
    state.currentPlayers = data.players;
    state.currentScores = data.scores;
    state.currentTurn = 0;
    state.scoreInput = '';

    const settings = JSON.parse(data.session.settings || '{}');
    state.settings = settings;

    renderGame();
    showPage('game');
  } catch (err) {
    console.error('Failed to load game:', err);
  }
}

// Render game based on type
function renderGame() {
  const container = document.getElementById('page-game');
  const type = state.currentSession.game_type;
  const isCompleted = state.currentSession.status === 'completed';

  switch (type) {
    case 'darts': renderDarts(container, isCompleted); break;
    case '500': render500(container, isCompleted); break;
    case 'scrabble': renderScrabble(container, isCompleted); break;
    case 'mini-golf': renderMiniGolf(container, isCompleted); break;
    case 'rummy': renderRummy(container, isCompleted); break;
    default: renderGeneric(container, isCompleted); break;
  }
}

// DARTS
// ==========================================
function renderDarts(container, isCompleted) {
  const startScore = state.settings.startScore || 501;
  const players = state.currentPlayers;
  const scores = state.currentScores;

  // Calculate remaining for each player
  const remaining = {};
  const rounds = {};
  players.forEach(p => {
    remaining[p.id] = startScore;
    rounds[p.id] = [];
  });
  scores.forEach(s => {
    remaining[s.player_id] -= s.score;
    if (!rounds[s.player_id]) rounds[s.player_id] = [];
    rounds[s.player_id].push(s);
  });

  // Determine current turn
  const totalThrows = scores.length;
  const currentPlayerIdx = totalThrows % players.length;
  const currentPlayer = players[currentPlayerIdx];

  // Check for winner
  let winner = null;
  players.forEach(p => {
    if (remaining[p.id] === 0) winner = p;
  });

  // Checkout suggestions
  const checkouts = getCheckoutHint(remaining[currentPlayer?.id] || 0);

  let html = '';

  if (winner && !isCompleted) {
    html += `<div class="winner-banner">
      <div class="trophy">🏆</div>
      <div class="winner-text">${winner.player_name} wins!</div>
    </div>`;
  }

  // Scoreboard
  html += '<div class="scoreboard">';
  players.forEach((p, i) => {
    const isActive = i === currentPlayerIdx && !winner && !isCompleted;
    const isWinner = winner && winner.id === p.id;
    html += `
      <div class="score-player ${isActive ? 'active-turn' : ''} ${isWinner ? 'winner' : ''}">
        <div class="score-player-header">
          <div>
            <div class="score-player-name">${p.player_name}</div>
            <div class="score-player-detail">${rounds[p.id].length} rounds thrown</div>
          </div>
          <div class="score-player-total">${remaining[p.id]}</div>
        </div>
      </div>`;
  });
  html += '</div>';

  // Input area (if not completed and no winner)
  if (!isCompleted && !winner) {
    if (checkouts) {
      html += `<div class="darts-checkout-hint">${checkouts}</div>`;
    }

    html += `<div class="score-input-label">Score for ${currentPlayer.player_name}</div>`;
    html += `<div class="score-input-display" id="dart-display">${state.scoreInput || '0'}</div>`;

    // Quick scores
    html += `<div class="quick-scores">
      <button class="quick-score-btn" onclick="dartQuick(26)">26</button>
      <button class="quick-score-btn" onclick="dartQuick(41)">41</button>
      <button class="quick-score-btn" onclick="dartQuick(45)">45</button>
      <button class="quick-score-btn" onclick="dartQuick(60)">60</button>
      <button class="quick-score-btn" onclick="dartQuick(85)">85</button>
      <button class="quick-score-btn" onclick="dartQuick(100)">100</button>
      <button class="quick-score-btn" onclick="dartQuick(140)">140</button>
      <button class="quick-score-btn" onclick="dartQuick(180)">180</button>
    </div>`;

    // Numpad
    html += renderNumpad('submitDartScore');
  }

  // History
  html += renderScoreHistory(scores, players);

  // Actions
  html += renderGameActions(isCompleted, !!winner);

  container.innerHTML = html;
}

function dartQuick(value) {

async function submitDartScore() {
  const value = parseInt(state.scoreInput) || 0;
  if (value < 0 || value > 180) return;

  const startScore = state.settings.startScore || 501;
  const players = state.currentPlayers;
  const scores = state.currentScores;

  const currentPlayerIdx = scores.length % players.length;
  const currentPlayer = players[currentPlayerIdx];

  // Calculate current remaining
  let rem = startScore;
  scores.filter(s => s.player_id === currentPlayer.id).forEach(s => rem -= s.score);

  // Check for bust
  if (rem - value < 0) {
    alert('Bust! Score would go below 0.');
    return;
  }

  const round = Math.floor(scores.filter(s => s.player_id === currentPlayer.id).length) + 1;

  await addScore(currentPlayer.id, round, value);
}

// ==========================================
// 500 CARD GAME
// ==========================================
function render500(container, isCompleted) {
  const players = state.currentPlayers;
  const scores = state.currentScores;

  // Calculate totals per player/team
  const totals = {};
  const roundScores = {};
  players.forEach(p => { totals[p.id] = 0; roundScores[p.id] = []; });
  scores.forEach(s => {
    totals[s.player_id] = (totals[s.player_id] || 0) + s.score;
    if (!roundScores[s.player_id]) roundScores[s.player_id] = [];
    roundScores[s.player_id].push(s);
  });

  // Check for winner (first to 500) or loser (below -500)
  let winner = null;
  players.forEach(p => {
    if (totals[p.id] >= 500) winner = p;
  });
  let loser = null;
  players.forEach(p => {
    if (totals[p.id] <= -500) loser = p;
  });

  let html = '';

  if (winner && !isCompleted) {
    html += `<div class="winner-banner">
      <div class="trophy">🏆</div>
      <div class="winner-text">${winner.player_name} wins!</div>
    </div>`;
  } else if (loser && !isCompleted) {
    html += `<div class="winner-banner" style="border-color:var(--red);">
      <div class="trophy">💀</div>
      <div class="winner-text">${loser.player_name} is out at -500!</div>
    </div>`;
  }

  // Scoreboard
  html += '<div class="scoreboard">';
  players.forEach(p => {
    const total = totals[p.id];
    const isWin = total >= 500;
    const isLose = total <= -500;
    html += `
      <div class="score-player ${isWin ? 'winner' : ''}">
        <div class="score-player-header">
          <div>
            <div class="score-player-name">${p.player_name}</div>
            <div class="score-player-detail">${roundScores[p.id].length} hands played</div>
          </div>
          <div class="score-player-total" style="color:${total < 0 ? 'var(--red)' : total >= 500 ? 'var(--green)' : 'var(--text)'}">${total}</div>
        </div>
      </div>`;
  });
  html += '</div>';

  // Score input
  if (!isCompleted && !winner && !loser) {
    const maxRound = Math.max(0, ...scores.map(s => s.round));
    const nextRound = maxRound + 1;

    html += `<div class="section-header">Add Hand Scores (Round ${nextRound})</div>`;
    html += '<div class="team-score-input">';
    players.forEach(p => {
      html += `
        <div class="team-input-card">
          <h4>${p.player_name}</h4>
          <input type="number" class="form-input" id="score-500-${p.id}" placeholder="0" inputmode="numeric">
        </div>`;
    });
    html += '</div>';
    html += `<button class="btn btn-primary btn-full" onclick="submit500Scores(${nextRound})">Add Round Scores</button>`;
  }

  // Round history table
  if (scores.length > 0) {
    const maxRound = Math.max(...scores.map(s => s.round));
    html += '<div class="score-history"><h3>Round History</h3>';
    html += '<table class="score-table"><thead><tr><th>Rnd</th>';
    players.forEach(p => { html += `<th>${p.player_name}</th>`; });
    html += '</tr></thead><tbody>';

    for (let r = 1; r <= maxRound; r++) {
      html += `<tr><td>${r}</td>`;
      players.forEach(p => {
        const roundScore = scores.find(s => s.player_id === p.id && s.round === r);
        const val = roundScore ? roundScore.score : '-';
        html += `<td style="color:${roundScore && roundScore.score < 0 ? 'var(--red)' : 'inherit'}">${val}</td>`;
      });
      html += '</tr>';
    }

    // Totals row
    html += '<tr class="total-row"><td>Total</td>';
    players.forEach(p => {
      html += `<td style="color:${totals[p.id] < 0 ? 'var(--red)' : 'inherit'}">${totals[p.id]}</td>`;
    });
    html += '</tr></tbody></table></div>';
  }

  html += renderGameActions(isCompleted, !!(winner || loser));
  container.innerHTML = html;
}

async function submit500Scores(round) {
  const players = state.currentPlayers;
  for (const p of players) {
    const input = document.getElementById(`score-500-${p.id}`);
    const value = parseInt(input.value) || 0;
    if (value !== 0) {
      await addScore(p.id, round, value, null, true);
    }
  }
  await loadGame(state.currentSession.id);
}

function renderScrabble(container, isCompleted) {
  const players = state.currentPlayers;
  const scores = state.currentScores;

  const totals = {};
  players.forEach(p => { totals[p.id] = 0; });
  scores.forEach(s => { totals[s.player_id] = (totals[s.player_id] || 0) + s.score; });

  // Determine whose turn it is
  const totalEntries = scores.length;
  const currentPlayerIdx = totalEntries % players.length;
  const currentPlayer = players[currentPlayerIdx];

  // Find leader
  let maxScore = -Infinity;
  let leader = null;
  players.forEach(p => {
    if (totals[p.id] > maxScore) { maxScore = totals[p.id]; leader = p; }

  let html = '';

  html += '<div class="scoreboard">';
  players.forEach((p, i) => {
    const isActive = i === currentPlayerIdx && !isCompleted;
    const isLeader = leader && leader.id === p.id && scores.length > 0;
    html += `
      <div class="score-player ${isActive ? 'active-turn' : ''}">

          <div>
            <div class="score-player-name">${p.player_name} ${isLeader ? '👑' : ''}</div>
            <div class="score-player-detail">${scores.filter(s => s.player_id === p.id).length} words</div>
          </div>

  if (!isCompleted) {

    html += `<div class="score-input-label">Word score for ${currentPlayer.player_name}</div>`;
    html += `<div class="score-input-display" id="scrabble-display">${state.scoreInput || '0'}</div>`;

    </div>`;

    html += renderNumpad('submitScrabbleScore', round);
  }

  // History
  html += renderScoreHistory(scores, players);
  html += renderGameActions(isCompleted, false);
  container.innerHTML = html;
}

// ==========================================
// MINI GOLF
// ==========================================
function renderMiniGolf(container, isCompleted) {
  const players = state.currentPlayers;
  const scores = state.currentScores;
  const totalHoles = state.settings.holes || 18;

  // Organize scores by hole
  const holeScores = {};
  const totals = {};
  players.forEach(p => { totals[p.id] = 0; holeScores[p.id] = {}; });
  scores.forEach(s => {
    holeScores[s.player_id][s.round] = s;
    totals[s.player_id] += s.score;
  });

  // Current hole (next hole that doesn't have all players scored)
  let currentHole = 1;
  for (let h = 1; h <= totalHoles; h++) {
    const allScored = players.every(p => holeScores[p.id][h]);
    if (!allScored) { currentHole = h; break; }
    if (h === totalHoles && allScored) currentHole = totalHoles + 1;
  }

  const gameFinished = currentHole > totalHoles;

  // Find leader (lowest score)
  let minScore = Infinity;
  let leader = null;
  if (scores.length > 0) {
    players.forEach(p => {
      if (totals[p.id] < minScore) { minScore = totals[p.id]; leader = p; }
    });
  }

  let html = '';

  if (gameFinished && !isCompleted) {
    html += `<div class="winner-banner">
      <div class="trophy">⛳🏆</div>
      <div class="winner-text">${leader.player_name} wins with ${totals[leader.id]} strokes!</div>
    </div>`;
  }

  // Scoreboard
  html += '<div class="scoreboard">';
  players.forEach(p => {
    const holesPlayed = Object.keys(holeScores[p.id]).length;
    html += `
      <div class="score-player ${leader && leader.id === p.id && scores.length > 0 ? 'winner' : ''}">
        <div class="score-player-header">
          <div>
            <div class="score-player-name">${p.player_name}</div>
            <div class="score-player-detail">${holesPlayed}/${totalHoles} holes</div>
          </div>
          <div class="score-player-total">${totals[p.id]}</div>
        </div>
      </div>`;
  });
  html += '</div>';

  // Score entry for current hole
  if (!isCompleted && !gameFinished) {
    html += `<div class="section-header">Hole ${currentHole}</div>`;
    html += '<div class="team-score-input">';
    players.forEach(p => {
      const existing = holeScores[p.id][currentHole];
      html += `
        <div class="team-input-card">
          <h4>${p.player_name}</h4>
          <input type="number" class="form-input" id="golf-${p.id}"
            placeholder="Strokes" min="1" max="20" inputmode="numeric"
            value="${existing ? existing.score : ''}">
        </div>`;
    });
    html += '</div>';
    html += `<button class="btn btn-primary btn-full" onclick="submitGolfScores(${currentHole})">Save Hole ${currentHole}</button>`;
  }

  // Score table
  if (scores.length > 0) {
    html += '<div class="score-history"><h3>Scorecard</h3>';
    html += '<div style="overflow-x:auto;"><table class="score-table"><thead><tr><th>Hole</th>';
    players.forEach(p => { html += `<th>${p.player_name}</th>`; });
    html += '</tr></thead><tbody>';

    for (let h = 1; h <= Math.min(currentHole, totalHoles); h++) {
      const allScored = players.every(p => holeScores[p.id][h]);
      if (!allScored && h === currentHole) continue;
      html += `<tr><td>${h}</td>`;
      players.forEach(p => {
        const s = holeScores[p.id][h];
        html += `<td>${s ? s.score : '-'}</td>`;
      });
      html += '</tr>';
    }

    html += '<tr class="total-row"><td>Total</td>';
    players.forEach(p => { html += `<td>${totals[p.id]}</td>`; });
    html += '</tr></tbody></table></div></div>';
  }

  html += renderGameActions(isCompleted, gameFinished);
  container.innerHTML = html;
}

async function submitGolfScores(hole) {
  const players = state.currentPlayers;
  for (const p of players) {
    const input = document.getElementById(`golf-${p.id}`);
    const value = parseInt(input.value);
    if (value && value > 0) {
      // Check if score already exists for this hole
      const existing = state.currentScores.find(s => s.player_id === p.id && s.round === hole);
      if (!existing) {
        await addScore(p.id, hole, value, null, true);
      }
    }
  }
  await loadGame(state.currentSession.id);
}

    const maxRound = Math.max(...scores.map(s => s.round));
    html += '<div class="score-history"><h3>Round History</h3>';
    html += '<table class="score-table"><thead><tr><th>Rnd</th>';
    players.forEach(p => { html += `<th>${p.player_name}</th>`; });
    html += '</tr></thead><tbody>';

    for (let r = 1; r <= maxRound; r++) {
      html += `<tr><td>${r}</td>`;
      players.forEach(p => {
        const roundScore = scores.find(s => s.player_id === p.id && s.round === r);
        html += `<td>${roundScore ? roundScore.score : '-'}</td>`;
      });
      html += '</tr>';
    }

    html += '<tr class="total-row"><td>Total</td>';
    players.forEach(p => { html += `<td>${totals[p.id]}</td>`; });
    html += '</tr></tbody></table></div>';
  }

  html += renderGameActions(isCompleted, false);
  container.innerHTML = html;
}

async function submitRummyScores(round) {
  const players = state.currentPlayers;
  for (const p of players) {
    const input = document.getElementById(`rummy-${p.id}`);
    const value = parseInt(input.value) || 0;
    if (value !== 0) {
      await addScore(p.id, round, value, null, true);
    }
  }
  await loadGame(state.currentSession.id);
}

// ==========================================
// GENERIC COUNTER
// ==========================================
function renderGeneric(container, isCompleted) {
  const players = state.currentPlayers;
  const scores = state.currentScores;

  const totals = {};
  players.forEach(p => { totals[p.id] = 0; });
  scores.forEach(s => { totals[s.player_id] = (totals[s.player_id] || 0) + s.score; });

  let html = '';

  // Scoreboard with inline +/- buttons
  html += '<div class="scoreboard">';
  players.forEach(p => {
    html += `
      <div class="score-player">
        <div class="score-player-header">
          <div class="score-player-name">${p.player_name}</div>
          <div class="score-player-total" style="color:${totals[p.id] < 0 ? 'var(--red)' : 'var(--text)'}">${totals[p.id]}</div>
        </div>
        ${!isCompleted ? `
        <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">
          <button class="quick-score-btn negative" onclick="genericAdd('${p.id}', -10)">-10</button>
          <button class="quick-score-btn negative" onclick="genericAdd('${p.id}', -5)">-5</button>
          <button class="quick-score-btn negative" onclick="genericAdd('${p.id}', -1)">-1</button>
          <button class="quick-score-btn" onclick="genericAdd('${p.id}', 1)">+1</button>
          <button class="quick-score-btn" onclick="genericAdd('${p.id}', 5)">+5</button>
          <button class="quick-score-btn" onclick="genericAdd('${p.id}', 10)">+10</button>
        </div>
        <div style="display:flex;gap:6px;margin-top:6px;">
          <input type="number" class="form-input" id="generic-custom-${p.id}" placeholder="Custom" inputmode="numeric" style="flex:1;">
          <button class="btn btn-primary btn-sm" onclick="genericCustomAdd('${p.id}')">Add</button>
        </div>` : ''}
      </div>`;
  });
  html += '</div>';

  // History
  html += renderScoreHistory(scores, players);
  html += renderGameActions(isCompleted, false);
  container.innerHTML = html;
}

async function genericAdd(playerId, value) {
  const round = state.currentScores.filter(s => s.player_id === playerId).length + 1;
  await addScore(playerId, round, value);
}

async function genericCustomAdd(playerId) {
  const input = document.getElementById(`generic-custom-${playerId}`);
  const value = parseInt(input.value);
  if (isNaN(value)) return;
  input.value = '';
  const round = state.currentScores.filter(s => s.player_id === playerId).length + 1;
  await addScore(playerId, round, value);
}

// ==========================================
// SHARED HELPERS
// ==========================================

function renderNumpad(submitFn) {
  return `
    <div class="numpad">
      <button class="numpad-btn" onclick="numpadPress('1')">1</button>
      <button class="numpad-btn" onclick="numpadPress('2')">2</button>
      <button class="numpad-btn" onclick="numpadPress('3')">3</button>
      <button class="numpad-btn" onclick="numpadPress('4')">4</button>
      <button class="numpad-btn" onclick="numpadPress('5')">5</button>
      <button class="numpad-btn" onclick="numpadPress('6')">6</button>
      <button class="numpad-btn" onclick="numpadPress('7')">7</button>
      <button class="numpad-btn" onclick="numpadPress('8')">8</button>
      <button class="numpad-btn" onclick="numpadPress('9')">9</button>
      <button class="numpad-btn delete" onclick="numpadDelete()">⌫</button>
      <button class="numpad-btn" onclick="numpadPress('0')">0</button>
      <button class="numpad-btn action" onclick="${submitFn}()">✓</button>
    </div>`;
}

function numpadPress(digit) {
  if (state.scoreInput.length >= 4) return;
  state.scoreInput += digit;
  updateNumpadDisplay();
}

function numpadDelete() {
  state.scoreInput = state.scoreInput.slice(0, -1);
  updateNumpadDisplay();
}

function updateNumpadDisplay() {
  const displays = ['dart-display', 'scrabble-display'];
  displays.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = state.scoreInput || '0';
  });
}

function renderScoreHistory(scores, players) {
  if (scores.length === 0) return '';

  const playerMap = {};
  players.forEach(p => { playerMap[p.id] = p.player_name; });
  const isCompleted = state.currentSession.status === 'completed';

  let html = '<div class="score-history"><h3>History</h3>';
  // Show most recent first
  const reversed = [...scores].reverse();
  reversed.slice(0, 30).forEach(s => {
    html += `
      <div class="score-history-entry">
        <span class="player">${playerMap[s.player_id] || '?'}</span>
        <span class="value" style="color:${s.score < 0 ? 'var(--red)' : s.score > 0 ? 'var(--green)' : 'var(--text)'}">${s.score > 0 ? '+' : ''}${s.score}</span>
        ${!isCompleted ? `<button class="undo" onclick="undoScore(${s.id})">Undo</button>` : ''}
      </div>`;
  });
  if (scores.length > 30) {
    html += `<div style="text-align:center;padding:8px;color:var(--text2);font-size:12px;">+ ${scores.length - 30} more entries</div>`;
  }
  html += '</div>';
  return html;
}

function renderGameActions(isCompleted, hasWinner) {
  if (isCompleted) {
    return `<div class="game-actions">
      <button class="btn btn-ghost" onclick="showPage('home')">Back to Games</button>
      <button class="btn btn-primary" onclick="reactivateGame()">Reactivate</button>
    </div>`;
  }

  return `<div class="game-actions">
    ${hasWinner ? `<button class="btn btn-green" onclick="finishGame()">Save Result</button>` : ''}
    <button class="btn btn-ghost" onclick="confirmDelete()">Delete</button>
    <button class="btn btn-primary" onclick="finishGame()">End Game</button>
  </div>`;
}

// API helpers
async function addScore(playerId, round, score, note = null, skipReload = false) {
  try {
    const res = await fetch(`${API}/sessions/${state.currentSession.id}/scores`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ playerId, round, score, note }),
    });
    const data = await res.json();

    if (!skipReload) {
      state.scoreInput = '';
      await loadGame(state.currentSession.id);
    } else {
      state.currentScores.push(data.score);
    }
  } catch (err) {
    console.error('Failed to add score:', err);
  }
}

async function undoScore(scoreId) {
  try {
    await fetch(`${API}/sessions/${state.currentSession.id}/scores/${scoreId}`, {
      method: 'DELETE',
    });
    await loadGame(state.currentSession.id);
  } catch (err) {
    console.error('Failed to undo score:', err);
  }
}

async function finishGame() {
  try {
    await fetch(`${API}/sessions/${state.currentSession.id}/status`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'completed' }),
    });
    await loadGame(state.currentSession.id);
  } catch (err) {
    console.error('Failed to finish game:', err);
  }
}

async function reactivateGame() {
  try {
    await fetch(`${API}/sessions/${state.currentSession.id}/status`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'active' }),
    });
    await loadGame(state.currentSession.id);
  } catch (err) {
    console.error('Failed to reactivate game:', err);
  }
}

function confirmDelete() {
  showModal('Delete Game', 'Are you sure you want to delete this game? This cannot be undone.', async () => {
    try {
      await fetch(`${API}/sessions/${state.currentSession.id}`, { method: 'DELETE' });
      showPage('home');
    } catch (err) {
      console.error('Failed to delete game:', err);
    }
  });
}

function showModal(title, text, onConfirm) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-text').textContent = text;
  document.getElementById('modal-overlay').classList.add('active');
  document.getElementById('modal-confirm').onclick = () => {
    closeModal();
    onConfirm();
  };
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
}

// Init
initGameGrid();
loadSessions();
